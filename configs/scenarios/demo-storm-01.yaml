# Deterministic teaching fixture. It is not a historical event replay or live telemetry.
scenario_id: "DEMO-STORM-01"
name: "Chennai Urban Storm Exercise"
description: "A repeatable synthetic scenario for demonstrating the risk workflow without implying current Chennai conditions."
data_classification: "SIMULATED_SCENARIO"
assumption_note: "Rainfall, water levels, sensor depth, susceptibility, exposure and vulnerability are explicit demo fixtures. They are not verified measurements or ward statistics."
ward_id: "WARD-117"
policy_version: "1.0.0"
sensor_depth_m: 3.0
