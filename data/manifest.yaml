    sha256: 3A7AAF7718D8B5D276E230CE24E5303DA705BE746EA5D1F5860730E2FF32B09E
    format: HTML
    crs: >-
      The page embeds GeoJSON Point features as [longitude, latitude] and displays them
      through Leaflet over web tiles. A geodetic datum is not separately declared; no
      datum transformation is applied by the local processor.
    temporal_coverage: 2026-10-10 08:30 through 2026-10-11 08:30 Asia/Kolkata
    spatial_coverage: >-
      63 Chennai station records include source latitude/longitude; 62 station points fall
      within the processed GCC division union. One source point is outside the GCC union.
    units: mm; page says all units are shown in mm
    license: Not stated on the retrieved page
    preprocessing: >-
      Raw HTML response retained. The processor reads the page's embedded rainfall_data
      array, validates Chennai station codes and numeric values, and emits source-reported
      GeoJSON points for records within the GCC division union. It does not transform
      coordinates or use observations as risk inputs.
    quality_findings: >-
      63 Chennai station records have unique station codes and parseable coordinate,
      rainfall, and date fields; 62 fall within the GCC union. Six in-boundary stations
      report positive rainfall (4.4, 3.0, 2.2, 1.0, 0.8, and 0.4 mm); remaining in-boundary
      records report 0 mm. The source map serializes the coordinates as GeoJSON points.
    limitations: >-
      The retained page is a single dated snapshot. The source page does not separately
      declare the geodetic datum of its embedded longitude/latitude coordinates. One source
      point falls outside the processed GCC division union and is excluded from the GCC map.
      The snapshot is not a live feed and is not used for ward risk.
    status: raw_page_verified_source_rendered_station_points

